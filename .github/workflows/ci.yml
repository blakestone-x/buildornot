name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows has its own console encoding and .env paths.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Offline: no API key and no network calls in the tests.
      - run: python -m unittest discover -s tests -v
      - run: pip install . && buildornot --version
      - if: matrix.python == '3.12' && matrix.os == 'ubuntu-latest'
        run: pipx run --spec pyright==1.1.390 pyright buildornot.py
